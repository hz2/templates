# instantiates each template the way a user would, then runs its checks
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # catch upstream breakage (toolchain, nixpkgs, advisories) between edits
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [rust, typst, latex]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: instantiate template
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          destination="$RUNNER_TEMP/demo-$TEMPLATE"
          nix flake new -t ".#$TEMPLATE" "$destination"
          cd "$destination"
          if [ "$TEMPLATE" = rust ]; then
            sh init.sh demo-crate
            git init -q && git add -A
            nix flake check -L
          else
            nix develop --command make build
            nix develop --command make notes
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.template != 'rust'
        with:
          name: ${{ matrix.template }}-pdfs
          path: ${{ runner.temp }}/demo-${{ matrix.template }}/build/*.pdf
